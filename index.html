<style>
/* =========================================================
   NULLSHIFT // ARCHIVE TERMINAL
   CRT INTERFACE // ARG BUILD
   EXPANDED ARCHIVAL BUILD
   ========================================================= */

:root {
    --bg: #020403;
    --bg-soft: #050906;
    --text: #d7ffe3;
    --bright: #effff3;
    --accent: #9ee6ad;
    --dim: #587360;
    --muted: #354a3b;
    --warning: #d2cf9a;
    --danger: #d58b8b;
    --line: rgba(220,255,230,0.11);
    --glow: rgba(90,255,130,0.24);
    --scanline: rgba(210,255,225,0.075);
}

/* ---------------------------------------------------------
   RESET
   --------------------------------------------------------- */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family:
        "Courier New",
        Courier,
        monospace;
    overflow: hidden;
}

/* ---------------------------------------------------------
   CRT BASE
   --------------------------------------------------------- */

body {
    position: relative;
    background:
        radial-gradient(
            ellipse at center,
            #07100a 0%,
            #030704 48%,
            #010201 100%
        );
}

/* STRONG VISIBLE SCANLINES */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 1000;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 2px,
            var(--scanline) 2px,
            var(--scanline) 3px,
            transparent 3px,
            transparent 5px
        );

    opacity: 0.72;

    mix-blend-mode: screen;
}

/* CRT VIGNETTE */

body::after {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 999;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,0.18) 72%,
            rgba(0,0,0,0.72) 100%
        );

    box-shadow:
        inset 0 0 140px rgba(0,255,100,0.08),
        inset 0 0 35px rgba(0,255,100,0.06);

    animation: crtPulse 5s ease-in-out infinite;
}

@keyframes crtPulse {
    0%, 100% {
        opacity: 0.92;
    }

    50% {
        opacity: 1;
    }
}

/* ---------------------------------------------------------
   TERMINAL
   --------------------------------------------------------- */

#terminal {
    width: 100%;
    height: 100%;

    padding:
        clamp(18px, 4vw, 42px);

    overflow-y: auto;

    scrollbar-width: thin;
    scrollbar-color:
        #315c3d
        #020403;

    position: relative;
}

#terminal::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            rgba(255,255,255,0.015),
            rgba(255,255,255,0.015)
        );

    animation: screenFlicker 0.16s infinite;
    opacity: 0.35;
}

@keyframes screenFlicker {
    0% {
        opacity: 0.32;
    }

    50% {
        opacity: 0.38;
    }

    100% {
        opacity: 0.31;
    }
}

/* ---------------------------------------------------------
   OUTPUT
   --------------------------------------------------------- */

#output {
    max-width: 1050px;

    margin: 0 auto;

    white-space: pre-wrap;
    word-break: break-word;

    line-height: 1.55;

    font-size: clamp(
        13px,
        1.25vw,
        16px
    );

    text-shadow:
        0 0 4px rgba(100,255,150,0.28),
        0 0 14px rgba(70,255,120,0.08);

.line {
    margin: 3px 0;

    animation:
        lineAppear
        0.08s
        ease-out;
}

@keyframes lineAppear {
    from {
        opacity: 0;
        transform: translateX(-2px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

.muted {

.danger {

.accent {

.corrupt {

   --------------------------------------------------------- */

@keyframes inputGlow {

/* ---------------------------------------------------------
   GLITCH
   --------------------------------------------------------- */

@keyframes glitch {
    0% {
        transform: translate(0);
    }

    20% {
        transform: translate(-1px, 1px);
    }

    40% {
        transform: translate(1px, -1px);
    }

    60% {
        transform: translate(-1px, 0);
    }

    80% {
        transform: translate(1px, 1px);
    }

    100% {
        transform: translate(0);
    }
}

   --------------------------------------------------------- */

/* ---------------------------------------------------------

function print(text = "", className = "") {

    const line =
        document.createElement("div");

    line.className =
        "line " + className;

    line.textContent =
        text;

    output.appendChild(line);

    terminal.scrollTop =
        terminal.scrollHeight;
}


function printLines(lines, className = "") {

    lines.forEach(line => {
        print(line, className);
    });

}


function clearScreen() {

    output.innerHTML = "";

}


function sleep(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );

}


function separator() {

    print(
        "──────────────────────────────────────────────────",
        "dim"
    );

}


function section(title) {

    print("");
    print(title, "title");
    separator();

}

        "AXIOM",

        "[REDACTED]"

        Math.floor(
            Math.random() *
            fragments.length

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

function getCommandNames() {

    return [
        ...Object.keys(commands),
        ...Object.keys(aliases),
        ...Object.keys(hiddenCommands)
    ];

}


function autocomplete(value) {

    const query =
        value.trim().toLowerCase();

    if (!query) return;

    const matches =
        getCommandNames()
            .filter(command =>
                command.startsWith(query)
            );

    if (matches.length === 1) {

        input.value =
            matches[0];

        return;

    }

    if (matches.length > 1) {

        print("");

        print(
            "POSSIBLE COMMANDS:",
            "dim"
        );

        matches.forEach(command => {

            print(
                "  " + command,
                "dim"
            );

        });

        print("");

    }

}


/* =========================================================
   COMMAND PROCESSOR
   ========================================================= */

async function executeCommand(raw) {

    const original =
        raw.trim();

    const command =
        original.toLowerCase();

    if (!command) return;

    print(
        "> " + original,
        "command"
    );

    commandHistory.push(original);

    historyIndex =
        commandHistory.length;


    /* HIDDEN COMMANDS */

    if (hiddenCommands[command]) {

        await hiddenCommands[command]();

        return;

    }


    /* DIRECT COMMAND */

    if (commands[command]) {

        await commands[command]();

        return;

    }


    /* ALIAS */

    if (aliases[command]) {

        await commands[
            aliases[command]
        ]();

        return;

    }


    /* FRIENDLY FRAGMENT ALIAS */

    if (
        command ===
        "the abyssal asymptote coalesces"
    ) {

        await commands.asymptote();

        return;

    }


    /* UNKNOWN */

    print("");

    print(
        "COMMAND NOT RECOGNIZED.",
        "warning"
    );

    print(
        "The archive cannot interpret:",
        "dim"
    );

    print(
        `"${original}"`,
        "danger"
    );

    print("");

    print(
        'Type "help" for available commands.'
    );

    print("");

}


/* =========================================================
   KEYBOARD INPUT
   ========================================================= */

input.addEventListener(
    "keydown",
    async function(event) {

        /* ENTER */

        if (event.key === "Enter") {

            const command =
                input.value;

            input.value = "";

            await executeCommand(
                command
            );

            return;
        }


        /* UP */

        if (event.key === "ArrowUp") {

            event.preventDefault();

            if (
                commandHistory.length === 0
            ) return;

            historyIndex--;

            if (historyIndex < 0) {

                historyIndex = 0;

            }

            input.value =
                commandHistory[
                    historyIndex
                ] || "";

            return;
        }


        /* DOWN */

        if (event.key === "ArrowDown") {

            event.preventDefault();

            if (
                commandHistory.length === 0
            ) return;

            historyIndex++;

            if (
                historyIndex >=
                commandHistory.length
            ) {

                historyIndex =
                    commandHistory.length;

                input.value = "";

                return;
            }

            input.value =
                commandHistory[
                    historyIndex
                ] || "";

            return;
        }


        /* TAB */

        if (event.key === "Tab") {

            event.preventDefault();

            autocomplete(
                input.value
            );

            return;
        }

    }
);

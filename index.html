/* =========================================================

   ========================================================= */

* {

}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    background: var(--bg);
    color: var(--text);

    font-family:
        "Courier New",
        Courier,

    overflow: hidden;

/* =========================================================
   CRT
   ========================================================= */

body {

    position: relative;

    background:

        radial-gradient(
            ellipse at center,
            #07100a 0%,
            #030704 48%,
            #010201 100%
        );
}


body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1000;

    background:

        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 2px,
            var(--scanline) 2px,
            var(--scanline) 3px,
            transparent 3px,
            transparent 5px
        );

    opacity: 0.72;

    mix-blend-mode: screen;
}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 999;

    background:

        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,0.18) 72%,
            rgba(0,0,0,0.72) 100%
        );

    box-shadow:

        inset 0 0 140px
        rgba(0,255,100,0.08),

        inset 0 0 35px
        rgba(0,255,100,0.06);

    animation:
        crtPulse
        5s
        ease-in-out
        infinite;
}


@keyframes crtPulse {

    0%, 100% {
        opacity: 0.92;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   TERMINAL
   ========================================================= */

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

function getCommandNames() {

    return [
        ...Object.keys(commands),
        ...Object.keys(aliases)
    ];

}


function autocomplete(value) {

    const query =
        value.trim().toLowerCase();

    if (!query) return;

    const matches =
        getCommandNames()
            .filter(
                command =>
                    command.startsWith(query)
            );

    if (matches.length === 1) {

        input.value =
            matches[0];

        return;
    }

    if (matches.length > 1) {

        print("");

        print(
            "POSSIBLE COMMANDS:",
            "dim"
        );

        matches.forEach(
            command =>
                print(
                    "  " + command,
                    "dim"
                )
        );

        print("");

    }

}


/* =========================================================
   COMMAND PROCESSOR
   ========================================================= */

async function executeCommand(raw) {

    const original =
        raw.trim();

    const command =
        original.toLowerCase();

    if (!command) return;

    print(
        "> " + original,
        "command"
    );

    commandHistory.push(original);

    historyIndex =
        commandHistory.length;


    /* DIRECT COMMAND */

    if (commands[command]) {

        await commands[command]();

        return;
    }


    /* ALIAS */

    if (aliases[command]) {

        await commands[
            aliases[command]
        ]();

        return;
    }


    /* CANONICAL PHRASES */

    if (
        command ===
        "the fall is the rise"
    ) {

        await commands.fall();

        return;
    }


    if (
        command ===
        "the sun never sets in errata"
    ) {

        await commands.sun();

        return;
    }


    /* UNKNOWN */

    print("");

    print(
        "COMMAND NOT RECOGNIZED.",
        "warning"
    );

    print(
        `"${original}"`,
        "danger"
    );

    print("");

    print(
        'Type "help" for available commands.'
    );

    print("");

}


/* =========================================================
   KEYBOARD
   ========================================================= */

input.addEventListener(
    "keydown",
    async function(event) {

        /* ENTER */

        if (event.key === "Enter") {

            const command =
                input.value;

            input.value = "";

            await executeCommand(
                command
            );

            return;
        }


        /* UP */

        if (event.key === "ArrowUp") {

            event.preventDefault();

            if (
                commandHistory.length === 0
            ) return;

            historyIndex--;

            if (historyIndex < 0) {

                historyIndex = 0;

            }

            input.value =
                commandHistory[
                    historyIndex
                ] || "";

            return;
        }


        /* DOWN */

        if (event.key === "ArrowDown") {

            event.preventDefault();

            if (
                commandHistory.length === 0
            ) return;

            historyIndex++;

            if (
                historyIndex >=
                commandHistory.length
            ) {

                historyIndex =
                    commandHistory.length;

                input.value = "";

                return;
            }

            input.value =
                commandHistory[
                    historyIndex
                ] || "";

            return;
        }


        /* TAB */

        if (event.key === "Tab") {

            event.preventDefault();

            autocomplete(
                input.value
            );

        }

    }
);

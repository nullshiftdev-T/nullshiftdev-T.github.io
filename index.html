}

body::after {

function print(text = "", className = "") {

        "line " + className;

    line.textContent =
        text;

    output.appendChild(line);

    terminal.scrollTop =
        terminal.scrollHeight;

function printLines(lines, className = "") {

    lines.forEach(line => {
        print(line, className);

}


function clearScreen() {

    output.innerHTML = "";

function sleep(ms) {

    return new Promise(resolve =>

}

/* =========================================================
   AUTOCOMPLETE
   ========================================================= */

function getCommandNames() {

    return [
        ...Object.keys(commands),
        ...Object.keys(aliases),
        ...Object.keys(hiddenCommands)
    ];

}


function autocomplete(value) {

    const query =
        value.trim().toLowerCase();

    if (!query) return;

    const matches =
        getCommandNames()
            .filter(command =>
                command.startsWith(query)
            );

    if (matches.length === 1) {

        input.value =
            matches[0];

        return;
    }

    if (matches.length > 1) {

        print("");

        print(
            "POSSIBLE COMMANDS:",
            "dim"
        );

        matches.forEach(command => {

            print(
                "  " + command,
                "dim"
            );

        });

        print("");

    }

}

    if (
        command ===
        "the fall is the rise"
    ) {

        await commands.fall();

        return;
    }


    if (
        command ===
        "the sun never sets in errata"
    ) {

        await commands.sun();

        return;
    }


    /* UNKNOWN */

    print("");

    print(
        "COMMAND NOT RECOGNIZED.",
        "warning"
    );

    print(
        "The archive cannot interpret:",
        "dim"
    );

    print(
        `"${original}"`,
        "danger"
    );

    print("");

    print(
        'Type "help" for available commands.'
    );

    print("");

}


/* =========================================================
   KEYBOARD
   ========================================================= */

input.addEventListener(
    "keydown",
    async function(event) {

        if (event.key === "Enter") {

            const command =
                input.value;

            input.value = "";

            await executeCommand(
                command
            );

            return;
        }


        if (event.key === "ArrowUp") {

            event.preventDefault();

            if (
                commandHistory.length === 0
            ) return;

            historyIndex--;

            if (historyIndex < 0) {
                historyIndex = 0;
            }

            input.value =
                commandHistory[
                    historyIndex
                ] || "";

            return;
        }


        if (event.key === "ArrowDown") {

            event.preventDefault();

            if (
                commandHistory.length === 0
            ) return;

            historyIndex++;

            if (
                historyIndex >=
                commandHistory.length
            ) {

                historyIndex =
                    commandHistory.length;

                input.value = "";

                return;
            }

            input.value =
                commandHistory[
                    historyIndex
                ] || "";

            return;
        }


        if (event.key === "Tab") {

            event.preventDefault();

            autocomplete(
                input.value
            );

            return;
        }

    }
);


/* =========================================================
   FOCUS
   ========================================================= */

document.addEventListener(
    "click",
    function() {

        input.focus();

    }
);


/* =========================================================
   START
   ========================================================= */

boot();

</script>

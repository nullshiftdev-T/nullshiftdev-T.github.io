<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NULLSHIFT // ARCHIVE</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #020403;
        color: #d7ffe3;
        font-family: "Courier New", Courier, monospace;
        overflow: hidden;
    }

    body {
        position: relative;
    }

    /* Scanlines */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );
    }

    /* CRT glow */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 19;
        box-shadow:
            inset 0 0 120px rgba(0, 255, 100, 0.08),
            inset 0 0 30px rgba(0, 255, 100, 0.04);
    }

    #terminal {
        width: 100%;
        height: 100%;
        padding: 28px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #315c3d #020403;
    }

    #output {
        max-width: 1000px;
        margin: 0 auto;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
        text-shadow: 0 0 6px rgba(100,255,150,0.25);
    }

    .line {
        margin: 2px 0;
    }

    .dim {
        color: #66816d;
    }

    .warning {
        color: #d7d19a;
    }

    .danger {
        color: #d98b8b;
    }

    .accent {
        color: #b8e6c2;
    }

    .title {
        color: #e8fff0;
        text-shadow:
            0 0 5px rgba(180,255,200,0.4),
            0 0 20px rgba(80,255,120,0.15);
    }

    .command {
        color: #ffffff;
    }

    .input-line {
        display: flex;
        max-width: 1000px;
        margin: 10px auto 0;
    }

    .prompt {
        color: #8dbd98;
        margin-right: 8px;
        user-select: none;
    }

    #commandInput {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: #f0fff3;
        font-family: inherit;
        font-size: inherit;
        caret-color: #d7ffe3;
        text-shadow: 0 0 6px rgba(100,255,150,0.3);
    }

    .cursor {
        display: inline-block;
        width: 8px;
        height: 17px;
        background: #ccefd5;
        animation: blink 1s steps(1) infinite;
        vertical-align: -3px;
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }

    .glitch {
        animation: glitch 0.12s infinite;
    }

    @keyframes glitch {
        0% { transform: translate(0); }
        25% { transform: translate(-1px, 1px); }
        50% { transform: translate(1px, -1px); }
        75% { transform: translate(-1px, -1px); }
        100% { transform: translate(0); }
    }

    @media (max-width: 600px) {
        #terminal {
            padding: 16px;
        }

        #output,
        #commandInput {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<div id="terminal">
    <div id="output"></div>

    <div class="input-line">
        <span class="prompt">&gt;</span>
        <input
            id="commandInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            autofocus
            aria-label="NULLSHIFT command input"
        >
    </div>
</div>

<script>

/* =========================================================
   NULLSHIFT ARCHIVE TERMINAL
   ========================================================= */

const output = document.getElementById("output");
const input = document.getElementById("commandInput");
const terminal = document.getElementById("terminal");

let commandHistory = [];
let historyIndex = -1;

let discovered = {
    axiom: false,
    hades: false,
    threnody: false,
    paries: false,
    simulation: false
};


/* =========================================================
   BASIC OUTPUT
   ========================================================= */

function print(text = "", className = "") {
    const line = document.createElement("div");
    line.className = "line " + className;
    line.textContent = text;
    output.appendChild(line);

    terminal.scrollTop = terminal.scrollHeight;
}

function printHTML(html, className = "") {
    const line = document.createElement("div");
    line.className = "line " + className;
    line.innerHTML = html;
    output.appendChild(line);

    terminal.scrollTop = terminal.scrollHeight;
}

function clearScreen() {
    output.innerHTML = "";
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}


/* =========================================================
   BOOT SEQUENCE
   ========================================================= */

async function boot() {

    print("NULLSHIFT ARCHIVE TERMINAL", "title");
    print("==============================================", "dim");

    await sleep(250);

    print("INITIALIZING ARCHIVE...", "dim");
    await sleep(350);

    print("CONNECTING TO SYSTEM NODE...", "dim");
    await sleep(350);

    print("NODE CONNECTED.", "accent");
    await sleep(200);

    print("");
    print("UNAUTHORIZED ARCHIVE ACCESS", "warning");
    print("CURRENT SYSTEM NODE: CANDIDATE 9502026#", "accent");
    print("SIMULATION: #777", "accent");

    print("");
    print("WARNING: ARCHIVE INTEGRITY CANNOT BE VERIFIED.", "warning");
    print("");
    print('Type "help" to view available commands.');
    print("");
}

boot();


/* =========================================================
   COMMANDS
   ========================================================= */

const commands = {

    help() {

        print("----------------------------------------------");
        print("help          Display available commands");
        print("status        Query system status");
        print("lore          Access archived fragments");
        print("archive       Browse recovered records");
        print("identity      Query candidate information");
        print("realisation   Access recovered audio record");
        print("about         About NULLSHIFT");
        print("clear         Clear terminal");
        print("");
    },


    status() {

        print("----------------------------------------------");

        print("PATTERN:     [ONLINE]");
        print("MEMORY:      [UNSTABLE]");
        print("AWARENESS:   [UNKNOWN]");

        print("FOUNDATION ARC: ACTIVE");
        print("ARCHIVE INTEGRITY: 71%");
        print("");

        if (discovered.simulation) {
            print("OBSERVATION STATUS: COMPROMISED", "danger");
        } else {
            print("OBSERVATION STATUS: NOMINAL", "dim");
        }

        print("");
    },


    lore() {

        print("");
        print("ARCHIVED FRAGMENTS", "title");
        print("----------------------------------------------");

        print("[01] THE AXIOM");
        print("[02] THE FOUR LAYERS");
        print("[03] THE HADES SIGIL");
        print("[04] THE THRENODY");
        print("[05] THE LAST PARIES");
        print("[06] SIMULATION #777");
        print("[07] [DATA CORRUPTED]");

        print("");

        print("");
    },


    archive() {

        print("----------------------------------------------");

        print("  ├─ observation_002");
        print("  ├─ candidate.log");
        print("  └─ foundation.arc");

        print("");
        print("/METAPHYSICS");
        print("  ├─ axiom.dat");
        print("  ├─ four_layers.dat");
        print("  └─ awareness.err");

        print("");
        print("/SIGILS");
        print("  └─ hades.sig");

        print("");
        print("/AUDIO");
        print("  └─ realisation.dat");

        print("");
        print("/UNKNOWN");
        print("  └─ [ACCESS DENIED]", "danger");

        print("");
    },


    identity() {

        print("");
        print("IDENTITY RECORD", "title");
        print("----------------------------------------------");

        print("DESIGNATION: CANDIDATE 9502026#");
        print("CLASSIFICATION: [UNKNOWN]");
        print("ORIGIN: [REDACTED]");
        print("MEMORY STATE: PARTIAL");
        print("AWARENESS STATE: DEVELOPING");

        print("");

        print("Candidate appears capable of observing");
        print("systems outside expected parameters.");

        print("");

        print("");
    },


    realisation() {

        print("");
        print("RECOVERED AUDIO RECORD", "title");
        print("----------------------------------------------");

        print("TITLE: REALISATION");

        print("STATUS: RECOVERED");

        print("");
        print("The file exists outside this terminal.");
        print("Audio playback interface: [PENDING]");

    about() {

    /* =====================================================

    paries() {

        discovered.paries = true;

        print("");

    observe() {

        print("----------------------------------------------");

    transcend() {

        print("");
        print("REQUESTING TRANSCENDENCE...", "dim");
        print("");

        setTimeout(() => {
            document.body.classList.add("glitch");

            print("MATTER ............... RELEASED");
            print("PATTERN .............. UNSTABLE");
            print("MEMORY ............... COLLAPSING");
            print("AWARENESS ............ [RECOGNIZED]", "warning");

            setTimeout(() => {
                document.body.classList.remove("glitch");

                print("");
                print("YOU HAVE REACHED A LAYER");
                print("THE ARCHIVE CANNOT NAME.");

        }, 400);
    },


    "777"() {

        discovered.simulation = true;

        print("");
        print("SIMULATION #777", "title");
        print("----------------------------------------------");

        print("STATUS: ACTIVE");
        print("OBSERVATION: CONFIRMED");
        print("CANDIDATE: 9502026#");

        print("");
        print("There was never supposed to be");
        print("a record of this simulation.");

};


/* =========================================================
   COMMAND PROCESSOR
   ========================================================= */

async function executeCommand(raw) {

    const command = raw.trim().toLowerCase();

    if (!command) return;

    print("> " + raw, "command");

    commandHistory.push(raw);
    historyIndex = commandHistory.length;

    if (commands[command]) {
        await commands[command]();
        return;
    }

    if (command === "realization") {
        await commands.realisation();
        return;
    }

    print("");
    print("COMMAND NOT RECOGNIZED.", "warning");
    print('Type "help" for available commands.');
    print("");
}


/* =========================================================
   INPUT
   ========================================================= */

input.addEventListener("keydown", async function(event) {

    if (event.key === "Enter") {

        const command = input.value;

        input.value = "";

        await executeCommand(command);

        return;
    }


    if (event.key === "ArrowUp") {

        event.preventDefault();

        if (commandHistory.length === 0) return;

        historyIndex--;

        if (historyIndex < 0) {
            historyIndex = 0;
        }

        input.value = commandHistory[historyIndex] || "";
    }


    if (event.key === "ArrowDown") {

        event.preventDefault();

        if (commandHistory.length === 0) return;

        historyIndex++;

        if (historyIndex >= commandHistory.length) {
            historyIndex = commandHistory.length;
            input.value = "";
            return;
        }

        input.value = commandHistory[historyIndex] || "";
    }

});


/* =========================================================
   KEEP TERMINAL FOCUSED
   ========================================================= */

document.addEventListener("click", () => {
    input.focus();
});

</script>

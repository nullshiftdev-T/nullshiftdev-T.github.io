<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_ERROR // NULLSHIFT</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        .terminal {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            padding: 20px;
            background-color: #0a0a0a;
        }
        .output-line {
            margin-bottom: 8px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .input-area {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }
        .prompt {
            color: #00ff66;
            margin-right: 10px;
            font-weight: bold;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
        }
        .glitch {
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="terminal">
    <div id="terminal-output">
        <div class="output-line glitch">=== WARNING: UNAUTHORIZED ARCHIVE ACCESS ===</div>
        <div class="output-line">INITIALIZING CORE REPOSITORY... SUCCESS.</div>
        <div class="output-line">CURRENT SYSTEM NODE: CANDIDATE 9502026#</div>
        <div class="output-line" style="color: #888;">Type 'help', 'status', or 'lore' to probe the framework.</div>
    </div>
    
    <div class="input-area">
        <span class="prompt">SYS:\></span>
        <input type="text" id="terminal-input" autofocus autocomplete="off">
    </div>
</div>

<script>
    const inputField = document.getElementById('terminal-input');
    const outputArea = document.getElementById('terminal-output');

    document.addEventListener('click', () => inputField.focus());

    inputField.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const command = this.value.trim().toLowerCase();
            this.value = '';
            
            printLine("SYS:\\> " + command, "#00aa44");
            
            switch(command) {
                case 'help':
                    printLine("AVAILABLE INTERFACES:\n -> status\n -> lore\n -> clear");
                    break;
                case 'status':
                                    case 'cosine':
                    printLine("PROCESSING TRIGONOMETRIC RESET...", "#00aa44");
                    printLine("The infinite cosine distils behind a blessed cinquain.");
                    break;
                case '9502026':
                    printLine("DECRYPTING DATA MATRIX...", "#ffcc00");
                    printLine("Candidate 9502026# Profile: RESTRICTED.\nStatus: Observing the observer.");
                    break;
                case 'realisation':
                    // This command triggers a visual terminal crash glitch!
                    printLine("CRITICAL REALITY FAILURE INCOMING...", "#ff3333");
                    setTimeout(() => {
                        outputArea.innerHTML = '<div class="output-line glitch" style="color:#ff3333; font-size: 24px;">RE-ALIGNING GEOMETRIES. WE SEE YOU.</div>';
                    }, 2000);
                    break;

                    printLine("ASYMPTOTE STATUS: Coalescing\nSTRUCTURE: Fractured Geometries\nSYSTEM INTEGRITY: Locked");
                    break;
                case 'lore':
                    printLine("The Abyssal Asymptote Coalesces Beneath A Hallowed Threnody.");
                    break;
                case 'clear':
                    outputArea.innerHTML = '';
                    break;
                default:
                    printLine("SYSTEM_ERROR: Command '" + command + "' unrecognized by the Archive framework.", "#ff3333");
            }
        }
    });

    function printLine(text, color = "#00ff66") {
        const line = document.createElement('div');
        line.className = 'output-line';
        line.style.color = color;
        line.innerText = text;
        outputArea.appendChild(line);
        window.scrollTo(0, document.body.scrollHeight);
    }
</script>

</body>
</html>

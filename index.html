function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));

/* =========================================================
   COMMAND PROCESSOR
   ========================================================= */

async function executeCommand(raw) {

    const command = raw.trim().toLowerCase();

    if (!command) return;

    print("> " + raw, "command");

    commandHistory.push(raw);
    historyIndex = commandHistory.length;

    if (commands[command]) {

        await commands[command]();
        return;
    }

    /*
       Alternate spelling intentionally supported.
    */

    if (command === "realization") {

        await commands.realisation();
        return;
    }


    /*
       Friendly fragment aliases.
    */

    if (command === "infinite cosine distills") {

        await commands.cosine();
        return;
    }

    if (command === "abyssal asymptote") {

        await commands.asymptote();
        return;
    }

    if (command === "liminal equation") {

        await commands.equation();
        return;
    }

    if (command === "unwritten outcomes") {

        await commands.outcomes();
        return;
    }


    print("");
    print("COMMAND NOT RECOGNIZED.", "warning");
    print('Type "help" for available commands.');
    print("");
}


/* =========================================================
   INPUT
   ========================================================= */

input.addEventListener("keydown", async function(event) {

    if (event.key === "Enter") {

        const command = input.value;

        input.value = "";

        await executeCommand(command);

        return;
    }


    if (event.key === "ArrowUp") {

        event.preventDefault();

        if (commandHistory.length === 0) return;

        historyIndex--;

        if (historyIndex < 0) {
            historyIndex = 0;
        }

        input.value = commandHistory[historyIndex] || "";
    }


    if (event.key === "ArrowDown") {

        event.preventDefault();

        if (commandHistory.length === 0) return;

        historyIndex++;

        if (historyIndex >= commandHistory.length) {

            historyIndex = commandHistory.length;

            input.value = "";

            return;
        }

        input.value = commandHistory[historyIndex] || "";
    }

});

document.addEventListener("click", function() {

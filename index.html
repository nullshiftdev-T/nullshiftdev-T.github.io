<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a" />
  <meta
    name="description"
    content="NULLSHIFT ARCHIVE — a visual and digital archive."
  />

  <title>NULLSHIFT // ARCHIVE</title>

  <style>
    /* =========================================================
       NULLSHIFT ARCHIVE
       Single-file interface
       Put the supplied image files beside this index.html.
       ========================================================= */

    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #050507;
      --bg-2: #09090d;
      --panel: rgba(14, 14, 19, 0.72);
      --panel-solid: #0d0d12;
      --line: rgba(255,255,255,.11);
      --line-bright: rgba(255,255,255,.25);
      --text: #f2f0ea;
      --muted: #85858e;
      --dim: #4d4d56;
      --gold: #d7b56d;
      --gold-bright: #f1d895;
      --violet: #8d78ad;
      --violet-dark: #251d30;
      --red: #8e384b;
      --green: #799b88;

      --mono: "IBM Plex Mono", monospace;
      --sans: "Space Grotesk", sans-serif;

      --radius: 3px;
      --max: 1480px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 75% 12%, rgba(100,72,120,.12), transparent 30%),
        radial-gradient(circle at 10% 70%, rgba(80,50,100,.08), transparent 28%),
        var(--bg);
      font-family: var(--sans);
      overflow-x: hidden;
      cursor: crosshair;
    }

    ::selection {
      color: #050507;
      background: var(--gold);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================================
       NOISE / GRID
       ========================================================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: .045;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.5) 0,
          rgba(255,255,255,.5) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode: overlay;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    /* =========================================================
       SCROLLBAR
       ========================================================= */

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #050507;
    }

    ::-webkit-scrollbar-thumb {
      background: #292932;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(5,5,7,.78);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      font-family: var(--mono);
      letter-spacing: .28em;
      font-size: 12px;
      font-weight: 600;
    }

    .brand-mark {
      width: 27px;
      height: 27px;
      border: 1px solid var(--gold);
      display: grid;
      place-items: center;
      transform: rotate(45deg);
      position: relative;
    }

    .brand-mark::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 50%;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(255,255,255,.3);
    }

    .brand-mark > * {
      transform: rotate(-45deg);
    }

    .nav {
      display: flex;
      gap: 28px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .18em;
      color: var(--muted);
    }

    .nav a {
      transition: color .2s ease;
      position: relative;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width .25s ease;
    }

    .nav a:hover {
      color: var(--gold-bright);
    }

    .nav a:hover::after {
      width: 100%;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .12em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: .4; }
      50% { opacity: 1; }
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      padding: 120px 30px 80px;
      overflow: hidden;
    }

    .hero-orbit {
      position: absolute;
      width: min(72vw, 920px);
      aspect-ratio: 1;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      animation: slowRotate 45s linear infinite;
    }

    .hero-orbit::before,
    .hero-orbit::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(215,181,109,.09);
      border-radius: 50%;
    }

    .hero-orbit::after {
      inset: 28%;
      border-color: rgba(141,120,173,.11);
    }

    @keyframes slowRotate {
      to { transform: rotate(360deg); }
    }

    .hero-crosshair {
      position: absolute;
      width: min(88vw, 1200px);
      height: min(88vw, 1200px);
      pointer-events: none;
    }

    .hero-crosshair::before,
    .hero-crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,.055);
    }

    .hero-crosshair::before {
      width: 1px;
      height: 100%;
      left: 50%;
    }

    .hero-crosshair::after {
      height: 1px;
      width: 100%;
      top: 50%;
    }

    .hero-inner {
      position: relative;
      width: min(1120px, 100%);
      text-align: center;
      z-index: 2;
    }

    .hero-kicker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .48em;
      color: var(--gold);
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .hero-logo {
      width: min(180px, 35vw);
      aspect-ratio: 1;
      object-fit: cover;
      margin: 0 auto 34px;
      filter:
        grayscale(.1)
        contrast(1.15)
        drop-shadow(0 0 35px rgba(215,181,109,.08));
      opacity: .96;
    }

    .hero-title {
      font-family: var(--mono);
      font-size: clamp(45px, 10vw, 125px);
      font-weight: 400;
      line-height: .82;
      letter-spacing: .24em;
      margin-right: -.24em;
      text-indent: .24em;
    }

    .hero-title span {
      color: var(--gold);
    }

    .hero-subtitle {
      margin-top: 34px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .28em;
      line-height: 2;
      text-transform: uppercase;
    }

    .hero-line {
      width: 150px;
      height: 1px;
      margin: 38px auto;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
    }

    .hero-meta {
      display: flex;
      justify-content: center;
      gap: 45px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .15em;
      color: var(--dim);
    }

    .hero-meta strong {
      color: var(--text);
      font-weight: 500;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .3em;
      color: var(--dim);
    }

    .scroll-indicator::after {
      content: "";
      display: block;
      width: 1px;
      height: 35px;
      margin: 12px auto 0;
      background: linear-gradient(var(--gold), transparent);
    }

    /* =========================================================
       GENERAL SECTION
       ========================================================= */

    .section {
      width: min(var(--max), calc(100% - 50px));
      margin: 0 auto;
      padding: 120px 0;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 55px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    .section-index {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .25em;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(27px, 4vw, 52px);
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .section-note {
      max-width: 390px;
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.8;
      letter-spacing: .08em;
      color: var(--muted);
      text-align: right;
    }

    /* =========================================================
       CONTROL PANEL
       ========================================================= */

    .control-grid {
      display: grid;
      grid-template-columns: 1.4fr .6fr .6fr .6fr;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.015);
    }

    .control-cell {
      min-height: 135px;
      padding: 25px;
      border-right: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .control-cell:last-child {
      border-right: none;
    }

    .control-cell::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -50px;
      bottom: -50px;
      border: 1px solid rgba(215,181,109,.12);
      transform: rotate(45deg);
    }

    .cell-label {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--dim);
      letter-spacing: .2em;
      margin-bottom: 19px;
    }

    .cell-value {
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: .08em;
    }

    .cell-value.gold {
      color: var(--gold);
    }

    .meter {
      width: 100%;
      height: 2px;
      margin-top: 17px;
      background: #1b1b20;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 73%;
      background: var(--gold);
      animation: meter 4s ease-in-out infinite alternate;
    }

    @keyframes meter {
      from { width: 57%; }
      to { width: 81%; }
    }

    /* =========================================================
       VISUAL ARCHIVE
       ========================================================= */

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .archive-card {
      position: relative;
      min-height: 380px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #09090d;
      isolation: isolate;
    }

    .archive-card:nth-child(1) {
      grid-column: span 7;
      min-height: 520px;
    }

    .archive-card:nth-child(2) {
      grid-column: span 5;
      min-height: 520px;
    }

    .archive-card:nth-child(3) {
      grid-column: span 4;
      min-height: 580px;
    }

    .archive-card:nth-child(4) {
      grid-column: span 4;
      min-height: 580px;
    }

    .archive-card:nth-child(5) {
      grid-column: span 4;
      min-height: 580px;
    }

    .archive-card:nth-child(n+6) {
      grid-column: span 3;
      min-height: 320px;
    }

    .archive-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform .8s cubic-bezier(.2,.7,.2,1),
        filter .8s ease;
      filter: grayscale(.15) contrast(1.05);
    }

    .archive-card:hover img {
      transform: scale(1.055);
      filter: grayscale(0) contrast(1.12);
    }

    .archive-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.12),
          transparent 40%,
          rgba(0,0,0,.88)
        );
      pointer-events: none;
    }

    .archive-number {
      position: absolute;
      z-index: 3;
      top: 16px;
      left: 17px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .2em;
      color: rgba(255,255,255,.65);
    }

    .archive-corner {
      position: absolute;
      z-index: 3;
      top: 14px;
      right: 15px;
      width: 17px;
      height: 17px;
      border-top: 1px solid rgba(255,255,255,.5);
      border-right: 1px solid rgba(255,255,255,.5);
    }

    .archive-info {
      position: absolute;
      z-index: 3;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 26px;
    }

    .archive-label {
      font-family: var(--mono);
      color: var(--gold);
      font-size: 8px;
      letter-spacing: .22em;
      margin-bottom: 8px;
    }

    .archive-name {
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .archive-desc {
      color: rgba(255,255,255,.52);
      font-family: var(--mono);
      font-size: 8px;
      line-height: 1.7;
      margin-top: 8px;
      max-width: 420px;
    }

    /* =========================================================
       DATA PANELS
       ========================================================= */

    .data-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .data-panel {
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(255,255,255,.025), transparent),
        var(--panel);
      padding: 34px;
      min-height: 390px;
      position: relative;
      overflow: hidden;
    }

    .data-panel::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255,255,255,.025);
      pointer-events: none;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
      margin-bottom: 40px;
    }

    .panel-code {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .2em;
      color: var(--gold);
    }

    .panel-state {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--green);
      letter-spacing: .14em;
    }

    .data-big {
      position: relative;
      z-index: 2;
      font-family: var(--mono);
      font-size: clamp(32px, 5vw, 66px);
      letter-spacing: .04em;
      margin-bottom: 12px;
    }

    .data-description {
      position: relative;
      z-index: 2;
      max-width: 560px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 2;
    }

    .coordinates {
      position: absolute;
      right: 30px;
      bottom: 30px;
      width: 170px;
      height: 170px;
      border: 1px solid rgba(215,181,109,.12);
      border-radius: 50%;
    }

    .coordinates::before,
    .coordinates::after {
      content: "";
      position: absolute;
      background: rgba(215,181,109,.14);
    }

    .coordinates::before {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
    }

    .coordinates::after {
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
    }

    .coordinates span {
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
      top: 37%;
      left: 62%;
      box-shadow: 0 0 15px var(--gold);
    }

    /* =========================================================
       SIGNAL MATRIX
       ========================================================= */

    .matrix {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 5px;
      height: 180px;
      align-items: end;
      margin-top: 28px;
    }

    .matrix i {
      display: block;
      height: calc(var(--h) * 1%);
      background: rgba(215,181,109,.65);
      opacity: .5;
      animation: signal 1.8s ease-in-out infinite alternate;
      animation-delay: calc(var(--d) * 1ms);
    }

    @keyframes signal {
      from {
        transform: scaleY(.65);
        opacity: .35;
      }
      to {
        transform: scaleY(1);
        opacity: .8;
      }
    }

    /* =========================================================
       TYPOGRAPHIC MANIFEST
       ========================================================= */

    .manifest {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 55px 0;
      overflow: hidden;
    }

    .manifest-track {
      display: flex;
      width: max-content;
      animation: marquee 32s linear infinite;
    }

    .manifest-track span {
      font-family: var(--mono);
      font-size: clamp(28px, 4vw, 56px);
      letter-spacing: .15em;
      white-space: nowrap;
      color: rgba(255,255,255,.09);
      padding-right: 50px;
    }

    .manifest-track span:nth-child(even) {
      color: rgba(215,181,109,.22);
    }

    @keyframes marquee {
      to { transform: translateX(-50%); }
    }

    /* =========================================================
       IMAGE WALL
       ========================================================= */

    .wall {
      columns: 4 250px;
      column-gap: 12px;
    }

    .wall-item {
      break-inside: avoid;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0a0a0e;
    }

    .wall-item img {
      width: 100%;
      transition: transform .7s ease, filter .7s ease;
      filter: saturate(.82);
    }

    .wall-item:hover img {
      transform: scale(1.035);
      filter: saturate(1.05);
    }

    .wall-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      padding: 6px 8px;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.13);
      font-family: var(--mono);
      font-size: 7px;
      letter-spacing: .16em;
      color: rgba(255,255,255,.7);
      backdrop-filter: blur(8px);
    }

    /* =========================================================
       TERMINAL
       ========================================================= */

    .terminal {
      border: 1px solid var(--line);
      background: #07070a;
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .terminal-bar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 17px;
      border-bottom: 1px solid var(--line);
    }

    .terminal-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #383840;
    }

    .terminal-title {
      margin-left: auto;
      margin-right: auto;
      font-family: var(--mono);
